[workspace]
members = [
    "crates/stellarr-core",
    "crates/stellarr-db",
    "crates/stellarr-api",
    "crates/stellarr-providers",
    "crates/stellarr-web",
    "stellarr",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stellarr Team"]
license = "MIT"
repository = "https://github.com/yourusername/stellarr"

[workspace.dependencies]
# Internal crates
stellarr-core = { path = "crates/stellarr-core" }
stellarr-db = { path = "crates/stellarr-db" }
stellarr-api = { path = "crates/stellarr-api" }
stellarr-providers = { path = "crates/stellarr-providers" }
stellarr-web = { path = "crates/stellarr-web" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Web server
actix-web = "4.9"
actix-cors = "0.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "chrono", "uuid"] }

# Frontend
leptos = { version = "0.7", features = ["csr"] }
leptos_meta = "0.7"
leptos_router = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
dotenv = "0.15"
config = "0.14"
